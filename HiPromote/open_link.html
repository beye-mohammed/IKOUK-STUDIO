<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Rotator</title>
<style>
  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
  }
</style>
</head>
<body>

<script>
(function(){
  // ضع هنا قائمة الروابط التي تريد تدويرها
  var URLS = [
    'https://omg10.com/4/9667709',
    'https://beye-mohammed.github.io/IKOUK-STUDIO/HiPromote/Appgalley_Banner.html'
  ];

  var QUEUE_KEY = 'site_rotator_queue_v1';
  var LAST_KEY  = 'site_rotator_last_v1';

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function safeParse(str){
    try { return JSON.parse(str); } catch(e){ return null; }
  }

  function pickNext(){
    var queue = safeParse(localStorage.getItem(QUEUE_KEY)) || [];
    queue = queue.filter(function(i){ return i >= 0 && i < URLS.length; });

    if (queue.length === 0){
      queue = shuffle(URLS.map(function(_, i){ return i; }));
      var last = Number(localStorage.getItem(LAST_KEY));
      if (queue.length > 1 && queue[0] === last){
        var swapWith = 1 + Math.floor(Math.random() * (queue.length - 1));
        var t = queue[0]; queue[0] = queue[swapWith]; queue[swapWith] = t;
      }
    }

    var nextIndex = queue.shift();
    localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
    localStorage.setItem(LAST_KEY, String(nextIndex));
    return URLS[nextIndex];
  }

  if (URLS.length){
    window.location.replace(pickNext());
  }
})();
</script>

</body>
</html>
