<style>
  *, *::before, *::after {
    margin: 0; padding: 0; box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: #0a0a0c;
  }

  body {
    overflow: hidden;
  }

  /* full-page iframe */
  #fullFrame {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    z-index: 9999;
    background: #fff;
  }

  /* minimal loading state while we validate + mount the iframe */
  #loadingScreen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    color: #888892;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 13px;
  }
  .spinner {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.12);
    border-top-color: #e8320a;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #errorScreen {
    display: none;
    position: fixed; inset: 0;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 24px;
    color: #f87171;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <span>Loading…</span>
</div>

<div id="errorScreen"></div>

<iframe id="fullFrame" allowfullscreen referrerpolicy="no-referrer"></iframe>

<script>
  let destinationUrl = null;

  const fullFrame     = document.getElementById('fullFrame');
  const loadingScreen = document.getElementById('loadingScreen');
  const errorScreen   = document.getElementById('errorScreen');

  // Turns a raw "q" value into a safe, absolute URL.
  // - Adds https:// if the scheme is missing (e.g. "example.com" -> "https://example.com")
  // - Leaves already-absolute URLs (http/https/mailto/tel...) untouched
  // - Rejects dangerous schemes (javascript:, data:, vbscript:) to avoid XSS
  function buildDestination(raw) {
    let value = raw.trim();
    if (!value) return null;

    if (/^\s*(javascript|data|vbscript):/i.test(value)) {
      return null;
    }

    const hasScheme = /^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(value) || /^(mailto:|tel:)/i.test(value);

    if (!hasScheme) {
      value = 'https://' + value;
    }

    try {
      const url = new URL(value);
      if (!/^https?:$/.test(url.protocol) && !/^(mailto:|tel:)$/.test(url.protocol)) {
        return null;
      }
      return url.href;
    } catch (e) {
      return null;
    }
  }

  function showError(msg) {
    loadingScreen.style.display = 'none';
    errorScreen.style.display = 'flex';
    errorScreen.textContent = msg;
  }

  function openInFullFrame(url) {
    fullFrame.src = url;
    fullFrame.onload = () => {
      loadingScreen.style.display = 'none';
    };
    fullFrame.style.display = 'block';
  }

  function startRedirect() {
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');

    if (!q) {
      showError('No redirect parameter found.');
      return;
    }

    const built = buildDestination(q);

    if (!built) {
      showError('This link is invalid or not allowed.');
      return;
    }

    destinationUrl = built;
    openInFullFrame(destinationUrl);
  }

  startRedirect();
</script>
</body>
</html>
