<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEYE Store — Secure Redirect</title>
<!-- Multi Tag Ad Script -->
<script src="https://quge5.com/88/tag.min.js" data-zone="254439" async data-cfasync="false"></script>
<style>
  *, *::before, *::after {
    margin: 0; padding: 0; box-sizing: border-box;
  }

  :root {
    --red: #e8320a;
    --red-dim: rgba(232, 50, 10, 0.12);
    --red-border: rgba(232, 50, 10, 0.30);
    --bg: #0a0a0c;
    --surface: #111114;
    --surface-2: #18181c;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.12);
    --text: #f0f0f2;
    --text-dim: #888892;
    --text-faint: #444450;
    --green: #22c55e;
    --green-dim: rgba(34, 197, 94, 0.12);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 20px;
  }

  /* subtle grid texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
  }

  /* ── top brand bar ── */
  .brand {
    display: flex; align-items: center; gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
  }
  .brand-logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--red);
    display: flex; align-items: center; justify-content: center;
  }
  .brand-logo svg { width: 18px; height: 18px; fill: #fff; }
  .brand-name {
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ── main card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* status header strip */
  .card-header {
    padding: 20px 24px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 0 3px var(--red-dim);
    animation: pulse 1.8s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px var(--red-dim); }
    50%       { box-shadow: 0 0 0 6px rgba(232,50,10,0.05); }
  }
  .status-text {
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--red);
  }
  .status-text.ready { color: var(--green); }
  .status-text.ready ~ .status-dot,
  .ready-dot {
    background: var(--green);
    box-shadow: 0 0 0 3px var(--green-dim);
    animation: none;
  }

  /* body */
  .card-body { padding: 28px 24px 24px; }

  .icon-ring {
    width: 72px; height: 72px; margin: 0 auto 20px;
    border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .icon-ring svg { width: 30px; height: 30px; }
  .icon-ring .ring-progress {
    position: absolute; inset: -4px;
    border-radius: 50%;
  }

  /* SVG countdown ring */
  #ring-svg {
    position: absolute; inset: -5px;
    width: calc(100% + 10px); height: calc(100% + 10px);
    transform: rotate(-90deg);
  }
  #ring-track { fill: none; stroke: var(--border); stroke-width: 2.5; }
  #ring-fill  {
    fill: none; stroke: var(--red); stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 226;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.9s linear, stroke 0.4s;
  }
  #ring-fill.done { stroke: var(--green); }

  .count-label {
    font-size: 28px; font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .count-label.done { color: var(--green); font-size: 22px; }

  h1 {
    font-size: 20px; font-weight: 600;
    text-align: center; margin-bottom: 6px;
    color: var(--text);
  }
  .subtitle {
    font-size: 13px; color: var(--text-dim);
    text-align: center; line-height: 1.6;
    margin-bottom: 24px;
  }

  /* destination preview */
  .dest-box {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 20px;
  }
  .dest-icon {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--red-dim); border: 1px solid var(--red-border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .dest-icon svg { width: 14px; height: 14px; stroke: var(--red); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dest-info { flex: 1; min-width: 0; }
  .dest-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
  .dest-url {
    font-size: 12px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: 'Courier New', monospace;
  }

  /* safety badges */
  .badges {
    display: flex; gap: 8px; margin-bottom: 22px;
  }
  .badge {
    flex: 1; background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .badge svg { width: 14px; height: 14px; stroke: var(--text-faint); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .badge span { font-size: 10px; color: var(--text-faint); text-align: center; }

  /* button */
  .btn {
    width: 100%; padding: 14px;
    border: none; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:disabled {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-faint);
    cursor: not-allowed;
  }
  .btn.active {
    background: var(--green);
    color: #fff;
    border: none;
    box-shadow: 0 0 20px rgba(34,197,94,0.25);
  }
  .btn.active:hover { transform: translateY(-1px); opacity: 0.92; }
  .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  /* error */
  .error-box {
    display: none;
    margin-top: 16px;
    background: rgba(248, 113, 113, 0.08);
    border: 1px solid rgba(248, 113, 113, 0.25);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-size: 13px; color: #f87171;
    text-align: center;
  }
  .error-box.show { display: block; }

  /* footer */
  .card-footer {
    padding: 12px 24px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 11px; color: var(--text-faint);
  }
  .card-footer a { color: var(--red); text-decoration: none; }
</style>
</head>
<body>

<div class="wrap">

  <div class="brand">
    <div class="brand-logo">
      <!-- flame icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C12 2 7 8 7 13a5 5 0 0010 0c0-3-2-5-2-5s0 3-2 3-2-2-2-2 1-4 1-7z"/>
      </svg>
    </div>
    <span class="brand-name">BEYE Store</span>
  </div>

  <div class="card">

    <div class="card-header">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Verifying link…</span>
    </div>

    <div class="card-body">

      <div class="icon-ring">
        <svg id="ring-svg" viewBox="0 0 82 82">
          <circle class="" id="ring-track" cx="41" cy="41" r="36"/>
          <circle id="ring-fill" cx="41" cy="41" r="36"/>
        </svg>
        <span class="count-label" id="countLabel">—</span>
      </div>

      <h1 id="mainTitle">Preparing your link</h1>
      <p class="subtitle" id="mainSub">Hold on while we verify the destination. This takes just a moment.</p>

      <div class="dest-box" id="destBox" style="display:none">
        <div class="dest-icon">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
        </div>
        <div class="dest-info">
          <div class="dest-label">Destination</div>
          <div class="dest-url" id="destUrl">—</div>
        </div>
      </div>

      <div class="badges">
        <div class="badge">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Safe redirect</span>
        </div>
        <div class="badge">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Brief delay</span>
        </div>
        <div class="badge">
          <svg viewBox="0 0 24 24"><path d="M1 6s4-2 11-2 11 2 11 2v13s-4 2-11 2S1 19 1 19V6z"/><path d="M1 6l11 7 11-7"/></svg>
          <span>No tracking</span>
        </div>
      </div>

      <button class="btn" id="continueBtn" disabled>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Waiting…
      </button>

      <div class="error-box" id="errorBox"></div>
    </div>

    <div class="card-footer">
      BEYE Store &mdash; <a href="https://zikapps.netlify.app/">zikapps.netlify.app</a>
    </div>

  </div>

</div>

<script>
  const SECONDS = 10;
  const CIRCUMFERENCE = 2 * Math.PI * 36; // ~226.2

  let destinationUrl = null;

  const ringFill   = document.getElementById('ring-fill');
  const countLabel = document.getElementById('countLabel');
  const btn        = document.getElementById('continueBtn');
  const errorBox   = document.getElementById('errorBox');
  const statusDot  = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const destBox    = document.getElementById('destBox');
  const destUrl    = document.getElementById('destUrl');
  const mainTitle  = document.getElementById('mainTitle');
  const mainSub    = document.getElementById('mainSub');

  ringFill.style.strokeDasharray  = CIRCUMFERENCE;
  ringFill.style.strokeDashoffset = CIRCUMFERENCE;

  async function startRedirect() {
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');

    if (!q) {
      showError('No redirect parameter found.');
      return;
    }

    try {
      const res  = await fetch('redirect_data.json');
      const data = await res.json();
      const item = data.find(x => x.link === q);

      if (!item) {
        showError('This link was not found or has expired.');
        return;
      }

      destinationUrl = item.tolink;

      // show destination
      destBox.style.display = 'flex';
      destUrl.textContent = destinationUrl;

      startCountdown();

    } catch (e) {
      showError('Could not load redirect data. Check your connection.');
    }
  }

  function startCountdown() {
    let seconds = SECONDS;
    countLabel.textContent = seconds;

    const interval = setInterval(() => {
      seconds--;
      const progress = (SECONDS - seconds) / SECONDS;
      ringFill.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);
      countLabel.textContent = seconds > 0 ? seconds : '';

      if (seconds <= 0) {
        clearInterval(interval);
        onReady();
      }
    }, 1000);
  }

  function onReady() {
    // ring turns green
    ringFill.classList.add('done');
    countLabel.classList.add('done');
    countLabel.innerHTML = '✓';

    // status bar
    statusDot.style.background = 'var(--green)';
    statusDot.style.boxShadow  = '0 0 0 3px var(--green-dim)';
    statusDot.style.animation  = 'none';
    statusText.textContent = 'Link verified — ready';
    statusText.classList.add('ready');

    // heading
    mainTitle.textContent = 'Ready to continue';
    mainSub.textContent   = 'Your destination has been verified. Click the button to proceed.';

    // button
    btn.disabled = false;
    btn.classList.add('active');
    btn.innerHTML = `
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
      Continue to destination
    `;
  }

  function showError(msg) {
    countLabel.textContent = '!';
    countLabel.style.color = '#f87171';
    ringFill.style.stroke  = '#f87171';
    statusDot.style.background = '#f87171';
    statusDot.style.animation  = 'none';
    statusText.textContent = 'Error';
    statusText.style.color = '#f87171';
    mainTitle.textContent  = 'Redirect failed';
    mainSub.textContent    = '';
    errorBox.textContent   = msg;
    errorBox.classList.add('show');
  }

  btn.addEventListener('click', () => {
    if (destinationUrl) window.location.href = destinationUrl;
  });

  startRedirect();
</script>
</body>
</html>
