<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEYE Hub | Fire Apps/Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --fire-gradient: linear-gradient(135deg, #ff416c, #ff4b2b);
            --neon-gradient: linear-gradient(135deg, #00b4db, #0083b0);
            --insta-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --dark-bg: #0a0a0a;
            --card-bg: #151515;
            --text-color: #ffffff;
            --padding-btn: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
        }

        /* Instagram Top Icon */
        .insta-contact {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 1001;
            font-size: 1.8rem;
            color: #fff;
            text-decoration: none;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .insta-contact i {
            background: var(--insta-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .insta-contact:hover {
            transform: scale(1.1) rotate(10deg);
            border-color: #e6683c;
            box-shadow: 0 0 15px rgba(230, 104, 60, 0.3);
        }

        /* Header Design */
        header {
            padding: 100px 20px 40px;
            text-align: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, var(--dark-bg) 100%);
            position: relative;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 3.5rem);
            background: var(--fire-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        header p {
            font-size: 0.8rem;
            letter-spacing: 5px;
            color: #555;
            text-transform: uppercase;
        }

        /* Navigation Bar */
        .nav-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .nav-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #888;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .nav-btn.active[data-target="all"] { background: #333; color: #fff; }
        .nav-btn.active[data-target="apps"] { background: var(--fire-gradient); color: #fff; border: none; }
        .nav-btn.active[data-target="games"] { background: var(--neon-gradient); color: #fff; border: none; }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            margin: 40px 0 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-transform: uppercase;
        }

        .section-header::after {
            content: '';
            height: 1px;
            flex-grow: 1;
            background: rgba(255,255,255,0.1);
        }

        /* Grid System */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; }
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 20px;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.4s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #444;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            background: #202020;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        .icon-box img { width: 100%; height: 100%; object-fit: cover; }

        .app-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 20px;
            color: #efefef;
            min-height: 2.8em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 5px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-top: auto;
            transition: 0.3s;
        }

        .app-card .btn { background: var(--fire-gradient); }
        .game-card .btn { background: var(--neon-gradient); }

        .btn:hover { filter: brightness(1.2); transform: scale(1.03); }

        #status-bar { text-align: center; color: #444; padding: 100px 0; }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.7rem;
            color: #333;
            letter-spacing: 1px;
        }

        /* Fade Animation */
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header>
    <a href="https://www.instagram.com/bzikoukmohammed" target="_blank" class="insta-contact" title="Contact on Instagram">
        <i class="fab fa-instagram"></i>
    </a>

    <h1>BEYE STORE</h1>
    <p>Premium App Repository</p>
</header>

<nav class="nav-container">
    <button class="nav-btn active" data-target="all">All Items</button>
    <button class="nav-btn" data-target="apps">Apps</button>
    <button class="nav-btn" data-target="games">Games</button>
</nav>

<div class="container">
    <div id="status-bar"><i class="fas fa-sync fa-spin"></i> Synchronizing Data...</div>

    <div id="app-container" class="fade-in" style="display: none;">
        <h2 class="section-header" style="color: #ff416c;">Applications</h2>
        <div id="app-grid" class="grid"></div>
    </div>

    <div id="game-container" class="fade-in" style="display: none;">
        <h2 class="section-header" style="color: #00b4db;">Games Zone</h2>
        <div id="game-grid" class="grid"></div>
    </div>
</div>

<footer>
    BEYE STORE &copy; 2026 |
    <a href="https://www.instagram.com/bzikoukmohammed" target="_blank" style="color: #555; text-decoration: none;">
        Contact Developer
    </a>
</footer>

<script>
    async function initStore() {
        const status = document.getElementById('status-bar');

        try {
            // جلب البيانات من ملف JSON
            const response = await fetch('data.json');
            if (!response.ok) throw new Error("Data file not found");

            const db = await response.json();
            status.style.display = 'none';

            // ملء التطبيقات
            if (db.applications && db.applications.length > 0) {
                document.getElementById('app-container').style.display = 'block';
                populateGrid(db.applications, 'app-grid', 'app-card');
            }

            // ملء الألعاب
            if (db.games && db.games.length > 0) {
                document.getElementById('game-container').style.display = 'block';
                populateGrid(db.games, 'game-grid', 'game-card');
            }

            setupNavigation();

        } catch (err) {
            status.innerHTML = "<i class='fas fa-exclamation-triangle'></i> Error loading data.json";
            console.error(err);
        }
    }

    function populateGrid(items, gridId, typeClass) {
        const grid = document.getElementById(gridId);
        grid.innerHTML = '';

        items.forEach(item => {
            const firstChar = item.name.trim().charAt(0);
            const hasIcon = item.icon && item.icon !== '' && item.icon !== 'icon_url_here';

            const card = document.createElement('div');
            card.className = `card ${typeClass}`;
            card.innerHTML = `
                <div class="icon-box">
                    ${hasIcon
                        ? `<img src="${item.icon}" alt="${item.name}" onerror="this.style.display='none'; this.nextSibling.style.display='flex';">`
                        : ''}
                    <span style="${hasIcon ? 'display:none;' : 'display:flex;'}">${firstChar}</span>
                </div>
                <div class="app-name">${item.name}</div>
                <a href="${item.link}" class="btn" target="_blank">Download</a>
            `;
            grid.appendChild(card);
        });
    }

    function setupNavigation() {
        const btns = document.querySelectorAll('.nav-btn');
        const appSec = document.getElementById('app-container');
        const gameSec = document.getElementById('game-container');

        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const target = btn.getAttribute('data-target');

                if (target === 'all') {
                    appSec.style.display = 'block';
                    gameSec.style.display = 'block';
                } else if (target === 'apps') {
                    appSec.style.display = 'block';
                    gameSec.style.display = 'none';
                } else if (target === 'games') {
                    appSec.style.display = 'none';
                    gameSec.style.display = 'block';
                }
            });
        });
    }

    window.onload = initStore;
</script>
</body>
</html>
